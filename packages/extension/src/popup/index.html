<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text2Invest</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 320px;
        padding: 16px;
        background: #fff;
        color: #1a1a1a;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .status {
        font-size: 13px;
        color: #666;
        margin-bottom: 16px;
        min-height: 20px;
      }
      .status.error {
        color: #dc2626;
      }
      .status.success {
        color: #16a34a;
      }
      .selection-preview {
        background: #f5f5f5;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 16px;
        font-size: 13px;
        max-height: 100px;
        overflow-y: auto;
        word-break: break-word;
        display: none;
      }
      .selection-preview.visible {
        display: block;
      }
      .truncation-notice {
        font-size: 11px;
        color: #f59e0b;
        margin-top: 8px;
      }
      button {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
      }
      button.primary:hover:not(:disabled) {
        background: #1d4ed8;
      }
      button.primary:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      button.secondary {
        background: #f3f4f6;
        color: #374151;
        margin-top: 8px;
      }
      button.secondary:hover {
        background: #e5e7eb;
      }
      button.danger {
        background: #fef2f2;
        color: #dc2626;
        margin-top: 8px;
      }
      button.danger:hover {
        background: #fee2e2;
      }
      .loading {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        font-size: 13px;
        color: #666;
      }
      .result-summary {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 16px;
      }
      .result-summary h2 {
        font-size: 14px;
        font-weight: 600;
        color: #166534;
        margin-bottom: 8px;
      }
      .result-summary p {
        font-size: 13px;
        color: #15803d;
        margin-bottom: 4px;
      }
      .disclaimer {
        font-size: 11px;
        color: #9ca3af;
        text-align: center;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #f3f4f6;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Text2Invest</h1>
    <div id="status" class="status">Select text on the page to analyze</div>
    <div id="selection-preview" class="selection-preview"></div>
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span id="loading-text" class="loading-text">Generating idea...</span>
    </div>
    <div id="result-summary" class="result-summary hidden">
      <h2>Analysis Complete</h2>
      <p id="result-tickers"></p>
      <p id="result-confidence"></p>
    </div>
    <button id="generate-btn" class="primary" disabled>Generate Idea</button>
    <button id="cancel-btn" class="danger hidden">Cancel</button>
    <button id="view-report-btn" class="secondary hidden">Open Full Report</button>
    <button id="open-panel-btn" class="secondary">Open Panel</button>
    <button id="settings-btn" class="secondary">Settings</button>
    <p class="disclaimer">Educational only - Not financial advice</p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
