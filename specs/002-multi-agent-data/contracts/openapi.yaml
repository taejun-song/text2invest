openapi: 3.1.0
info:
  title: Text2Invest Multi-Agent API
  version: 2.0.0
  description: |
    Extended API for multi-agent collaborative investment analysis.
    Backward compatible with v1 — enrichment fields are optional.

servers:
  - url: http://localhost:8000
    description: Local MCP server

paths:
  /api/v1/ideas:
    post:
      operationId: generateIdea
      summary: Generate investment idea with optional multi-agent enrichment
      description: |
        Executes the text analysis pipeline and, when data agents are enabled,
        launches collaborative agents for news, fundamentals, and macro analysis.
        Returns a unified report with optional enrichment sections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaRequest'
      responses:
        '200':
          description: Successfully generated investment idea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaReport'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Schema validation failed after retries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited by LLM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: LLM provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ideas/{ideaId}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel an in-flight generation request
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        '404':
          description: Generation not found or already completed

  /health:
    get:
      operationId: healthCheck
      summary: Server health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  version:
                    type: string

components:
  schemas:
    IdeaRequest:
      type: object
      required:
        - selection_text
        - url
        - title
        - user_settings
      properties:
        selection_text:
          type: string
          minLength: 20
          maxLength: 8000
        url:
          type: string
          format: uri
        title:
          type: string
        user_settings:
          $ref: '#/components/schemas/UserSettings'

    UserSettings:
      type: object
      required:
        - provider
        - model
      properties:
        provider:
          type: string
          enum: [openai, anthropic, ollama, nrp]
        model:
          type: string
        api_key:
          type: string
        base_url:
          type: string
          format: uri
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        pii_redaction:
          type: boolean
          default: true
        web_lookup:
          type: boolean
          default: false
        agent_configs:
          type: array
          items:
            $ref: '#/components/schemas/AgentConfig'

    AgentConfig:
      type: object
      required:
        - agent_id
        - enabled
        - use_external_data
      properties:
        agent_id:
          type: string
          enum: [news_agent, fundamentals_agent, risk_agent, macro_agent]
        enabled:
          type: boolean
          default: true
        use_external_data:
          type: boolean
          default: true

    IdeaReport:
      type: object
      required:
        - id
        - created_at
        - source
        - selection_text
        - tickers
        - thesis
        - executive_summary
        - rationale_quotes
        - catalysts
        - risks
        - counter_thesis
        - horizon
        - confidence_score
        - confidence_explanation
        - limitations
        - provider_meta
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/Source'
        selection_text:
          type: string
        tickers:
          type: array
          items:
            $ref: '#/components/schemas/Ticker'
        thesis:
          type: string
        executive_summary:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
        rationale_quotes:
          type: array
          items:
            $ref: '#/components/schemas/RationaleQuote'
        catalysts:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        counter_thesis:
          type: string
        horizon:
          type: string
          enum: [short, medium, long]
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
        confidence_explanation:
          type: string
        limitations:
          type: array
          items:
            type: string
        provider_meta:
          $ref: '#/components/schemas/ProviderMeta'
        # Enrichment fields (optional)
        news_context:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
          nullable: true
        fundamentals_summary:
          type: array
          items:
            $ref: '#/components/schemas/FundamentalsSnapshot'
          nullable: true
        cross_reference_analysis:
          $ref: '#/components/schemas/CrossReferenceAnalysis'
          nullable: true
        macro_context:
          $ref: '#/components/schemas/MacroContext'
          nullable: true
        agent_attributions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
        communication_log:
          $ref: '#/components/schemas/CommunicationLog'
          nullable: true

    Source:
      type: object
      required: [url, title]
      properties:
        url:
          type: string
          format: uri
        title:
          type: string

    Ticker:
      type: object
      required: [symbol, company_name, confidence]
      properties:
        symbol:
          type: string
          pattern: '^[A-Z]{1,5}$'
        company_name:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1

    RationaleQuote:
      type: object
      required: [quote, start_offset, end_offset]
      properties:
        quote:
          type: string
        start_offset:
          type: integer
          minimum: 0
        end_offset:
          type: integer
          minimum: 1

    ProviderMeta:
      type: object
      required: [provider, model, temperature, pipeline_duration_ms]
      properties:
        provider:
          type: string
        model:
          type: string
        temperature:
          type: number
        pipeline_duration_ms:
          type: integer

    NewsItem:
      type: object
      required: [headline, source, url, published_date, sentiment, relevance_score, summary, data_source]
      properties:
        headline:
          type: string
        source:
          type: string
        url:
          type: string
          format: uri
        published_date:
          type: string
        sentiment:
          type: string
          enum: [positive, negative, neutral]
        relevance_score:
          type: number
          minimum: 0
          maximum: 1
        summary:
          type: string
        data_source:
          type: string
          enum: [web_search, llm_knowledge]

    FundamentalsSnapshot:
      type: object
      required: [ticker, company_name, metrics, data_source, retrieved_at]
      properties:
        ticker:
          type: string
        company_name:
          type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/FinancialMetric'
        data_source:
          type: string
          enum: [web_search, llm_knowledge]
        retrieved_at:
          type: string
          format: date-time

    FinancialMetric:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
        period:
          type: string

    CrossReferenceAnalysis:
      type: object
      required: [convergences, divergences, deduplicated_risks]
      properties:
        convergences:
          type: array
          items:
            type: string
        divergences:
          type: array
          items:
            $ref: '#/components/schemas/Divergence'
        deduplicated_risks:
          type: array
          items:
            type: string

    Divergence:
      type: object
      required: [topic, finding_a, source_a, finding_b, source_b, explanation]
      properties:
        topic:
          type: string
        finding_a:
          type: string
        source_a:
          type: string
        finding_b:
          type: string
        source_b:
          type: string
        explanation:
          type: string

    MacroContext:
      type: object
      required: [sector, sector_trends, economic_indicators, headwinds, tailwinds, data_source]
      properties:
        sector:
          type: string
        sector_trends:
          type: array
          items:
            type: string
        economic_indicators:
          type: array
          items:
            type: string
        headwinds:
          type: array
          items:
            type: string
        tailwinds:
          type: array
          items:
            type: string
        data_source:
          type: string
          enum: [web_search, llm_knowledge]

    AgentMessage:
      type: object
      required: [id, sender, recipient, message_type, content, timestamp, round_number]
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
        recipient:
          type: string
        message_type:
          type: string
          enum: [finding, query, challenge, response]
        content:
          type: object
        timestamp:
          type: string
          format: date-time
        round_number:
          type: integer
          minimum: 1
          maximum: 3

    CommunicationLog:
      type: object
      required: [id, messages, total_rounds, duration_ms]
      properties:
        id:
          type: string
          format: uuid
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
        total_rounds:
          type: integer
          minimum: 0
          maximum: 3
        duration_ms:
          type: integer

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

    RateLimitError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [rate_limited]
        message:
          type: string
        retry_after_seconds:
          type: integer
