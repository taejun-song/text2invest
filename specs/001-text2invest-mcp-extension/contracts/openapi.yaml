openapi: 3.1.0
info:
  title: Text2Invest MCP Server API
  version: 1.0.0
  description: |
    API for the Text2Invest MCP server that generates structured investment ideas
    from selected text using a multi-stage AI agent pipeline.

servers:
  - url: http://localhost:8000
    description: Local MCP server

paths:
  /api/v1/ideas:
    post:
      operationId: generateIdea
      summary: Generate investment idea from selected text
      description: |
        Executes the multi-stage agent pipeline to produce a structured
        IdeaReport from the provided text selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaRequest'
      responses:
        '200':
          description: Successfully generated investment idea
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaReport'
        '400':
          description: Invalid request (text too short/long, invalid settings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Schema validation failed after retries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited by LLM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: LLM provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ideas/{ideaId}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel an in-flight generation request
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        '404':
          description: Generation not found or already completed

  /api/v1/evaluation:
    post:
      operationId: submitEvaluation
      summary: Submit user rating for an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '201':
          description: Evaluation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'

  /health:
    get:
      operationId: healthCheck
      summary: Server health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy]
                  version:
                    type: string

components:
  schemas:
    IdeaRequest:
      type: object
      required:
        - selection_text
        - url
        - title
        - user_settings
      properties:
        selection_text:
          type: string
          minLength: 20
          maxLength: 8000
          description: Text selected by user
        url:
          type: string
          format: uri
          description: Source page URL
        title:
          type: string
          description: Source page title
        user_settings:
          $ref: '#/components/schemas/UserSettings'

    UserSettings:
      type: object
      required:
        - provider
        - model
      properties:
        provider:
          type: string
          enum: [openai, anthropic, ollama]
        model:
          type: string
          description: Model identifier
        api_key:
          type: string
          description: Required for cloud providers
        base_url:
          type: string
          format: uri
          description: Required for Ollama
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7

    IdeaReport:
      type: object
      required:
        - id
        - created_at
        - source
        - selection_text
        - tickers
        - thesis
        - executive_summary
        - rationale_quotes
        - catalysts
        - risks
        - counter_thesis
        - horizon
        - confidence_score
        - confidence_explanation
        - limitations
        - provider_meta
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/Source'
        selection_text:
          type: string
        tickers:
          type: array
          items:
            $ref: '#/components/schemas/Ticker'
        thesis:
          type: string
        executive_summary:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
        rationale_quotes:
          type: array
          items:
            $ref: '#/components/schemas/RationaleQuote'
        catalysts:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        counter_thesis:
          type: string
        horizon:
          type: string
          enum: [short, medium, long]
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
        confidence_explanation:
          type: string
        limitations:
          type: array
          items:
            type: string
        provider_meta:
          $ref: '#/components/schemas/ProviderMeta'

    Source:
      type: object
      required:
        - url
        - title
      properties:
        url:
          type: string
          format: uri
        title:
          type: string

    Ticker:
      type: object
      required:
        - symbol
        - company_name
        - confidence
      properties:
        symbol:
          type: string
          pattern: '^[A-Z]{1,5}$'
        company_name:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1

    RationaleQuote:
      type: object
      required:
        - quote
        - start_offset
        - end_offset
      properties:
        quote:
          type: string
        start_offset:
          type: integer
          minimum: 0
        end_offset:
          type: integer
          minimum: 1

    ProviderMeta:
      type: object
      required:
        - provider
        - model
        - temperature
        - pipeline_duration_ms
      properties:
        provider:
          type: string
        model:
          type: string
        temperature:
          type: number
        pipeline_duration_ms:
          type: integer

    EvaluationRequest:
      type: object
      required:
        - idea_id
        - rating
      properties:
        idea_id:
          type: string
          format: uuid
        rating:
          type: string
          enum: [useful, not_useful]
        notes:
          type: string

    Evaluation:
      type: object
      required:
        - idea_id
        - rating
        - created_at
      properties:
        idea_id:
          type: string
          format: uuid
        rating:
          type: string
          enum: [useful, not_useful]
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

    RateLimitError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum: [rate_limited]
        message:
          type: string
        retry_after_seconds:
          type: integer
